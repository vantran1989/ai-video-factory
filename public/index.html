<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AI VIDEO FACTORY</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    sans-serif;

  background:
    #0b1020;

  color:
    white;

}

.container {

  max-width:
    760px;

  margin:
    auto;

  padding:
    20px;

}

.card {

  background:
    #151c35;

  border:
    1px solid #303b65;

  border-radius:
    24px;

  padding:
    24px;

  margin-bottom:
    20px;

}

h1 {

  margin-top:
    0;

  font-size:
    30px;

}

label {

  display:
    block;

  margin-top:
    18px;

  margin-bottom:
    8px;

}

input,
select,
button {

  width:
    100%;

  padding:
    15px;

  border-radius:
    14px;

  border:
    1px solid #39476d;

  background:
    #0d1429;

  color:
    white;

  font-size:
    16px;

}

button {

  margin-top:
    18px;

  background:
    #5865f2;

  border:
    0;

  font-weight:
    bold;

}

button:disabled {

  opacity:
    .5;

}

.status {

  margin-top:
    20px;

  padding:
    16px;

  border-radius:
    14px;

  background:
    #202947;

  white-space:
    pre-wrap;

}

.success {

  border:
    1px solid #38d27b;

}

.error {

  border:
    1px solid #ff5555;

}

video {

  width:
    100%;

  margin-top:
    20px;

  border-radius:
    16px;

  background:
    black;

}

.download {

  display:
    block;

  margin-top:
    15px;

  padding:
    15px;

  text-align:
    center;

  border-radius:
    14px;

  background:
    #20a85a;

  color:
    white;

  text-decoration:
    none;

  font-weight:
    bold;

}

.check {

  padding:
    10px;

  margin:
    6px 0;

  border-radius:
    10px;

  background:
    #202947;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
🎬 AI VIDEO FACTORY
</h1>

<p>
Tạo MP4 và kiểm tra hình ảnh trước khi tải.
</p>

<label>
Chủ đề
</label>

<input
  id="topic"
  value="5 mẹo chăm sóc mèo"
>

<label>
Số video
</label>

<input
  id="count"
  type="number"
  min="1"
  max="20"
  value="1"
>

<label>
Thời lượng
</label>

<select id="duration">

<option value="30">
30 giây
</option>

<option value="60">
60 giây
</option>

<option value="90">
90 giây
</option>

</select>

<label>
Phong cách
</label>

<select id="style">

<option>
viral, cuốn hút
</option>

<option>
giải thích
</option>

<option>
kể chuyện
</option>

<option>
ngắn gọn
</option>

</select>

<label>
Đối tượng
</label>

<input
  id="audience"
  value="người xem Facebook"
>

<button
  id="generate"
  onclick="generate()"
>

🚀 SẢN XUẤT VIDEO KIỂM TRA

</button>

<div
  id="status"
  class="status"
>

Sẵn sàng.

</div>

<div
  id="result"
></div>

</div>


<div class="card">

<h2>
🔎 KIỂM TRA VIDEO
</h2>

<input
  id="videoFile"
  type="file"
  accept="video/*"
>

<button
  onclick="inspectVideo()"
>

🔍 KIỂM TRA VIDEO

</button>

<button
  onclick="repairVideo()"
>

🛠️ SỬA VIDEO

</button>

<div
  id="inspectStatus"
  class="status"
>

Chưa kiểm tra.

</div>

<div
  id="repairResult"
></div>

</div>

</div>


<script>

function setStatus(
  text,
  type = ""
) {

  const box =
    document.getElementById(
      "status"
    );

  box.textContent =
    text;

  box.className =
    "status " +
    type;

}


async function generate() {

  const button =
    document.getElementById(
      "generate"
    );

  try {

    button.disabled =
      true;

    setStatus(
      "⏳ Đang tạo video...\n" +
      "Đang kiểm tra video stream..."
    );

    const topic =
      document.getElementById(
        "topic"
      ).value;

    const response =
      await fetch(
        "/api/generate",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              topic
            })

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Không tạo được video."
      );

    }

    setStatus(
      "✅ VIDEO ĐÃ ĐƯỢC KIỂM TRA.\n\n" +
      "Có hình: CÓ\n" +
      "Video stream: OK\n" +
      "Decode frame: OK",
      "success"
    );

    showVideo(
      "result",
      data.file
    );

  } catch (error) {

    setStatus(
      "❌ LỖI\n\n" +
      error.message,
      "error"
    );

  } finally {

    button.disabled =
      false;

  }

}


function showVideo(
  elementId,
  url
) {

  const element =
    document.getElementById(
      elementId
    );

  element.innerHTML = `

    <video
      controls
      playsinline
      preload="metadata"
      src="${url}"
    ></video>

    <a
      class="download"
      href="${url}"
    >
      ⬇️ TẢI MP4
    </a>

  `;

}


function getVideoFile() {

  const input =
    document.getElementById(
      "videoFile"
    );

  if (!input.files.length) {

    throw new Error(
      "Bạn chưa chọn video."
    );

  }

  return input.files[0];

}


async function inspectVideo() {

  const box =
    document.getElementById(
      "inspectStatus"
    );

  try {

    const file =
      getVideoFile();

    box.className =
      "status";

    box.textContent =
      "⏳ Đang kiểm tra...";

    const form =
      new FormData();

    form.append(
      "video",
      file
    );

    const response =
      await fetch(
        "/api/inspect",
        {

          method:
            "POST",

          body:
            form

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error
      );

    }

    let text =
      data.ok
        ? "✅ VIDEO HỢP LỆ\n\n"
        : "❌ VIDEO KHÔNG HỢP LỆ\n\n";

    for (
      const check
      of data.checks
    ) {

      text +=
        (
          check.ok
            ? "✅ "
            : "❌ "
        ) +

        check.name +

        ": " +

        check.message +

        "\n";

    }

    box.textContent =
      text;

    box.className =
      "status " +
      (
        data.ok
          ? "success"
          : "error"
      );

  } catch (error) {

    box.textContent =
      "❌ " +
      error.message;

    box.className =
      "status error";

  }

}


async function repairVideo() {

  const box =
    document.getElementById(
      "inspectStatus"
    );

  const result =
    document.getElementById(
      "repairResult"
    );

  try {

    const file =
      getVideoFile();

    box.className =
      "status";

    box.textContent =
      "⏳ Đang sửa video...\n" +
      "Kiểm tra hình → encode H.264 → kiểm tra lại.";

    result.innerHTML =
      "";

    const form =
      new FormData();

    form.append(
      "video",
      file
    );

    const response =
      await fetch(
        "/api/repair",
        {

          method:
            "POST",

          body:
            form

        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error
      );

    }

    box.textContent =
      "✅ SỬA THÀNH CÔNG\n\n" +
      "Có hình: CÓ\n" +
      "MP4: H.264\n" +
      "Pixel: yuv420p\n" +
      "Đã kiểm tra frame.";

    box.className =
      "status success";

    showVideo(
      "repairResult",
      data.file
    );

  } catch (error) {

    box.textContent =
      "❌ KHÔNG THỂ SỬA\n\n" +
      error.message;

    box.className =
      "status error";

  }

}

</script>

</body>

</html>
