<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AI VIDEO FACTORY</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
}

.container {
  max-width: 760px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #151c35;
  border: 1px solid #303b65;
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 20px;
}

h1 {
  margin-top: 0;
  font-size: 30px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
}

input,
select,
button {
  width: 100%;
  padding: 15px;
  border-radius: 14px;
  border: 1px solid #39476d;
  background: #0d1429;
  color: white;
  font-size: 16px;
}

button {
  margin-top: 18px;
  background: #5865f2;
  border: 0;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

.status {
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  background: #202947;
  white-space: pre-wrap;
}

.success {
  border: 1px solid #38d27b;
}

.error {
  border: 1px solid #ff5555;
}

video {
  width: 100%;
  margin-top: 20px;
  border-radius: 16px;
  background: black;
}

.download {
  display: block;
  margin-top: 15px;
  padding: 15px;
  text-align: center;
  border-radius: 14px;
  background: #20a85a;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.download.disabled {
  background: #555;
  pointer-events: none;
}

.check {
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  background: #202947;
}

.info {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: #11182d;
  font-size: 14px;
  line-height: 1.6;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>
🎬 AI VIDEO FACTORY
</h1>

<p>
Tạo MP4 và kiểm tra hình ảnh + âm thanh trước khi tải.
</p>

<label>
Chủ đề
</label>

<input
  id="topic"
  value="5 mẹo chăm sóc mèo"
>

<label>
Số video
</label>

<input
  id="count"
  type="number"
  min="1"
  max="5"
  value="1"
>

<label>
Thời lượng
</label>

<select id="duration">

<option value="30">
30 giây
</option>

<option value="60">
60 giây
</option>

<option value="90">
90 giây
</option>

</select>

<label>
Phong cách
</label>

<select id="style">

<option>
viral, cuốn hút
</option>

<option>
giải thích
</option>

<option>
kể chuyện
</option>

<option>
ngắn gọn
</option>

</select>

<label>
Đối tượng
</label>

<input
  id="audience"
  value="người xem Facebook"
>

<button
  id="generate"
  onclick="generate()"
>
🚀 SẢN XUẤT VIDEO KIỂM TRA
</button>

<div
  id="status"
  class="status"
>
Sẵn sàng.
</div>

<div
  id="result"
></div>

</div>


<div class="card">

<h2>
🔎 KIỂM TRA VIDEO
</h2>

<input
  id="videoFile"
  type="file"
  accept="video/*"
>

<button
  onclick="inspectVideo()"
>
🔍 KIỂM TRA VIDEO
</button>

<button
  onclick="repairVideo()"
>
🛠️ SỬA VIDEO
</button>

<div
  id="inspectStatus"
  class="status"
>
Chưa kiểm tra.
</div>

<div
  id="repairResult"
></div>

</div>

</div>


<script>

/* =====================================================
   STATUS
===================================================== */

function setStatus(text, type = "") {

  const box =
    document.getElementById("status");

  box.textContent = text;

  box.className =
    "status " + type;
}


/* =====================================================
   LẤY URL VIDEO AN TOÀN
=====================================================

   Chấp nhận tất cả dạng:

   data.file
   data.url
   data.videos[0].file
   data.videos[0].url

   Vì vậy không còn:
   /undefined
===================================================== */

function getVideoUrl(data) {

  if (!data) {
    return null;
  }

  if (
    typeof data.file === "string" &&
    data.file.trim()
  ) {
    return data.file.trim();
  }

  if (
    typeof data.url === "string" &&
    data.url.trim()
  ) {
    return data.url.trim();
  }

  if (
    Array.isArray(data.videos)
  ) {

    const video =
      data.videos.find(
        item =>
          item &&
          item.ok !== false &&
          (
            typeof item.file === "string" ||
            typeof item.url === "string"
          )
      );

    if (video) {

      if (
        typeof video.file === "string" &&
        video.file.trim()
      ) {
        return video.file.trim();
      }

      if (
        typeof video.url === "string" &&
        video.url.trim()
      ) {
        return video.url.trim();
      }

    }

  }

  return null;
}


/* =====================================================
   TẠO URL TUYỆT ĐỐI
===================================================== */

function absoluteVideoUrl(url) {

  if (!url) {
    return null;
  }

  try {

    return new URL(
      url,
      window.location.origin
    ).href;

  } catch {

    return null;

  }

}


/* =====================================================
   HIỂN THỊ VIDEO
===================================================== */

function showVideo(
  elementId,
  url,
  resultData = null
) {

  const element =
    document.getElementById(
      elementId
    );

  const finalUrl =
    absoluteVideoUrl(url);

  if (!finalUrl) {

    element.innerHTML = `
      <div class="status error">
        ❌ Không nhận được đường dẫn MP4.
        <br><br>
        Server không trả về file video hợp lệ.
      </div>
    `;

    return false;
  }

  /*
   * Thêm timestamp để tránh trình duyệt
   * giữ lại video cũ trong cache.
   */
  const videoUrl =
    finalUrl +
    (
      finalUrl.includes("?")
        ? "&"
        : "?"
    ) +
    "_t=" +
    Date.now();

  element.innerHTML = `

    <video
      id="${elementId}-player"
      controls
      playsinline
      preload="metadata"
      src="${videoUrl}"
    ></video>

    <a
      class="download"
      href="${finalUrl}"
      download="AI-VIDEO-FACTORY.mp4"
    >
      ⬇️ TẢI MP4
    </a>

    <div
      id="${elementId}-info"
      class="info"
    >
      ⏳ Đang đọc thông tin video...
    </div>

  `;

  const player =
    document.getElementById(
      `${elementId}-player`
    );

  const info =
    document.getElementById(
      `${elementId}-info`
    );

  player.addEventListener(
    "loadedmetadata",
    () => {

      const duration =
        Number(player.duration || 0);

      info.textContent =
        "✅ Video đã tải metadata.\n" +
        "Thời lượng: " +
        (
          duration > 0
            ? duration.toFixed(1) + " giây"
            : "chưa xác định"
        );

    }
  );

  player.addEventListener(
    "error",
    () => {

      info.textContent =
        "❌ Trình duyệt không đọc được MP4.\n" +
        "URL: " +
        finalUrl;

    }
  );

  return true;
}


/* =====================================================
   SẢN XUẤT VIDEO
===================================================== */

async function generate() {

  const button =
    document.getElementById(
      "generate"
    );

  const result =
    document.getElementById(
      "result"
    );

  try {

    button.disabled = true;

    result.innerHTML = "";

    setStatus(
      "⏳ Đang tạo video...\n\n" +
      "Đang tạo hình...\n" +
      "Đang tạo video H.264...\n" +
      "Đang kiểm tra frame..."
    );

    const topic =
      document.getElementById(
        "topic"
      ).value.trim();

    const count =
      Number(
        document.getElementById(
          "count"
        ).value
      );

    const duration =
      Number(
        document.getElementById(
          "duration"
        ).value
      );

    const style =
      document.getElementById(
        "style"
      ).value;

    const audience =
      document.getElementById(
        "audience"
      ).value;

    if (!topic) {

      throw new Error(
        "Bạn chưa nhập chủ đề."
      );

    }

    const response =
      await fetch(
        "/api/generate",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              topic,

              count:
                Math.max(
                  1,
                  Math.min(
                    count || 1,
                    5
                  )
                ),

              duration:
                Math.max(
                  1,
                  Math.min(
                    duration || 30,
                    300
                  )
                ),

              style,

              audience

            })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server không trả về JSON hợp lệ."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        "Không tạo được video."
      );

    }


    const videoUrl =
      getVideoUrl(data);


    if (!videoUrl) {

      console.error(
        "API RESPONSE:",
        data
      );

      throw new Error(
        "Server đã trả kết quả nhưng không có đường dẫn MP4."
      );

    }


    const successful =
      Array.isArray(data.videos)
        ? data.videos.filter(
            item => item && item.ok
          ).length
        : 1;


    setStatus(
      "✅ VIDEO ĐÃ ĐƯỢC KIỂM TRA.\n\n" +

      "Có hình: CÓ\n" +

      "Video stream: OK\n" +

      "Decode frame: OK\n" +

      "Audio: OK\n\n" +

      "Đã tạo: " +
      successful +
      " video",
      
      "success"
    );


    showVideo(
      "result",
      videoUrl,
      data
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ LỖI\n\n" +
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;

  }

}


/* =====================================================
   LẤY FILE VIDEO
===================================================== */

function getVideoFile() {

  const input =
    document.getElementById(
      "videoFile"
    );

  if (
    !input.files ||
    !input.files.length
  ) {

    throw new Error(
      "Bạn chưa chọn video."
    );

  }

  return input.files[0];

}


/* =====================================================
   KIỂM TRA VIDEO
===================================================== */

async function inspectVideo() {

  const box =
    document.getElementById(
      "inspectStatus"
    );

  try {

    const file =
      getVideoFile();

    box.className =
      "status";

    box.textContent =
      "⏳ Đang kiểm tra...";


    const form =
      new FormData();

    form.append(
      "video",
      file
    );


    const response =
      await fetch(
        "/api/inspect",
        {
          method: "POST",
          body: form
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server không trả về JSON."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Không kiểm tra được video."
      );

    }


    let text =
      data.ok
        ? "✅ VIDEO HỢP LỆ\n\n"
        : "❌ VIDEO KHÔNG HỢP LỆ\n\n";


    if (
      data.info
    ) {

      text +=
        "Hình: " +
        (
          data.info.hasVideo
            ? "CÓ"
            : "KHÔNG"
        ) +
        "\n";

      text +=
        "Âm thanh: " +
        (
          data.info.hasAudio
            ? "CÓ"
            : "KHÔNG"
        ) +
        "\n";

      text +=
        "Kích thước: " +
        data.info.width +
        " x " +
        data.info.height +
        "\n";

      text +=
        "Thời lượng: " +
        Number(
          data.info.duration || 0
        ).toFixed(2) +
        " giây\n\n";

    }


    if (
      Array.isArray(data.checks)
    ) {

      for (
        const check
        of data.checks
      ) {

        text +=
          (
            check.ok
              ? "✅ "
              : "❌ "
          ) +

          check.name +

          ": " +

          check.message +

          "\n";

      }

    }


    box.textContent =
      text;

    box.className =
      "status " +
      (
        data.ok
          ? "success"
          : "error"
      );


  } catch (error) {

    box.textContent =
      "❌ " +
      error.message;

    box.className =
      "status error";

  }

}


/* =====================================================
   SỬA VIDEO
===================================================== */

async function repairVideo() {

  const box =
    document.getElementById(
      "inspectStatus"
    );

  const result =
    document.getElementById(
      "repairResult"
    );


  try {

    const file =
      getVideoFile();


    box.className =
      "status";

    box.textContent =
      "⏳ Đang sửa video...\n\n" +
      "Kiểm tra hình → " +
      "encode H.264 → " +
      "kiểm tra lại.";


    result.innerHTML =
      "";


    const form =
      new FormData();

    form.append(
      "video",
      file
    );


    const response =
      await fetch(
        "/api/repair",
        {
          method: "POST",
          body: form
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server không trả về JSON."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Không thể sửa video."
      );

    }


    const videoUrl =
      getVideoUrl(data);


    if (!videoUrl) {

      throw new Error(
        "Sửa xong nhưng server không trả đường dẫn MP4."
      );

    }


    box.textContent =
      "✅ SỬA THÀNH CÔNG\n\n" +

      "Có hình: CÓ\n" +

      "MP4: H.264\n" +

      "Pixel: yuv420p\n" +

      "Đã kiểm tra frame.";


    box.className =
      "status success";


    showVideo(
      "repairResult",
      videoUrl,
      data
    );


  } catch (error) {

    box.textContent =
      "❌ KHÔNG THỂ SỬA\n\n" +
      error.message;

    box.className =
      "status error";

  }

}

</script>

</body>
</html>
